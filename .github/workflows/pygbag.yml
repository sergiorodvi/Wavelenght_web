name: pygbag_build
on: [workflow_dispatch]

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pygbag y compilar a WebAssembly
        run: |
          python -m pip install pygbag
          python -m pygbag --build $GITHUB_WORKSPACE/main.py

      - name: Desactivar Jekyll (imprescindible para servir JS/WASM correctamente)
        run: touch $GITHUB_WORKSPACE/build/web/.nojekyll

      - name: Publicar en la rama gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
